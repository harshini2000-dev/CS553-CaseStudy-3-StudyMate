global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Single-container deployment (MODE=both)
  - job_name: studymate_node
    static_configs:
      - targets: ["group5_studymate_app:9100"]

  - job_name: studymate_app
    static_configs:
      - targets: ["group5_studymate_app:8000"]